[package]
name = "preview-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
preview = { path = "../preview" }

[features]
web = ["dioxus/web", "preview/web"]
desktop = ["dioxus/desktop"]
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack"]
