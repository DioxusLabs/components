[package]
name = "preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-code = { git = "https://github.com/nikuda/dioxus-code", branch = "dioxus-v0.8.0-alpha.2", default-features = false, features = ["macro", "lang-css"] }
dioxus-icons = { git = "https://github.com/nikuda/dioxus-icons", branch = "dioxus-v0.8.0-alpha.2" }
dioxus-primitives.workspace = true
dioxus-i18n = "=0.7.0-alpha.1"
palette = "0.7.6"
unic-langid = { version = "0.9", features = ["macros"] }
strum = { version = "0.27.2", features = ["derive"] }
tracing = { workspace = true }
time = { version = "0.3.44", features = ["std", "macros"] }


[build-dependencies]
dioxus = { workspace = true }
dioxus-code = { git = "https://github.com/nikuda/dioxus-code", branch = "dioxus-v0.8.0-alpha.2", default-features = false, features = ["runtime", "lang-css"] }
dioxus-ssr.workspace = true
pulldown-cmark = "0.13.0"
serde_json = "1"

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
web = ["dioxus/web", "dioxus-primitives/web"]
desktop = ["dioxus/desktop"]
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "dioxus/fullstack"]
native = ["dioxus/native"]
