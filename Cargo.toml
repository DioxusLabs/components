[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus = "=0.8.0-alpha.2"
dioxus-code = { git = "https://github.com/nikuda/dioxus-code", branch = "dioxus-v0.8.0-alpha.2", default-features = false }
dioxus-i18n = "=0.7.0-alpha.1"
dioxus-icons = { git = "https://github.com/nikuda/dioxus-icons", branch = "dioxus-v0.8.0-alpha.2" }
dioxus-primitives = { path = "primitives" }
dioxus-rsx = "=0.8.0-alpha.2"
dioxus-sdk-time = { git = "https://github.com/nikuda/dioxus-sdk", branch = "dioxus-v0.8.0-alpha.2" }
dioxus-ssr = "=0.8.0-alpha.2"
lazy-js-bundle = "=0.8.0-alpha.2"
tracing = { version = "0.1", features = ["std"] }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
