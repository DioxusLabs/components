[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus = "=0.8.0-alpha.3"
dioxus-code = { version = "=0.2.0-alpha.3", default-features = false }
dioxus-i18n = "=0.7.0-alpha.1"
dioxus-icons = "=0.2.0-alpha.3"
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "286874cc101cfaef2395b56e93c4f27887c38338", features = ["prelude"] }
dioxus-primitives = { path = "primitives" }
dioxus-rsx = "=0.8.0-alpha.3"
dioxus-sdk-time = "=0.8.0-alpha.3"
dioxus-ssr = "=0.8.0-alpha.3"
lazy-js-bundle = "=0.8.0-alpha.3"
tracing = { version = "0.1", features = ["std"] }

[profile.release]
debug = false
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
