[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-code = { git = "https://github.com/DioxusLabs/dioxus-code", branch = "0.8", default-features = false }
dioxus-i18n = "=0.7.0-alpha.1"
dioxus-icons = { git = "https://github.com/DioxusLabs/dioxus-icons", branch = "0.8" }
dioxus-primitives = { path = "primitives" }
dioxus-rsx = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-sdk-time = { git = "https://github.com/DioxusLabs/sdk", branch = "0.8" }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-test = { git = "https://github.com/DioxusLabs/dioxus-test", branch = "nth-match-on-query-all" }
lazy-js-bundle = "=0.8.0-alpha.3"
tracing = { version = "0.1", features = ["std"] }

[patch.crates-io]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz" }
dioxus = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-core-template = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-icons = { git = "https://github.com/DioxusLabs/dioxus-icons", branch = "0.8" }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus" }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.dev]
debug = 0

[profile.dev.build-override]
opt-level = 3
codegen-units = 1
